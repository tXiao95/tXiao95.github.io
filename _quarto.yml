project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - publications.qmd
    - teaching.qmd
    - contact.qmd
    - 404.qmd
  resources:
    - cv.pdf
    - assets/
    - "!CNAME"
    - "!tmp/**"
    - "!_internal/**"
    - "!README.md"
    - "!docs/**"
  pre-render: python3 scripts/prepare.py
  post-render: python3 scripts/finalize.py

website:
  title: Thomas Hsiao
  site-url: https://txiao95.github.io
  description: "Thomas Hsiao is a postdoctoral researcher in Biostatistics at Emory University, studying causal inference, spatial statistics, and informative missingness."
  favicon: assets/favicon-theta-hat.png
  search: false
  open-graph: false

format:
  html:
    theme: none
    minimal: true
    template: templates/page.html
    css: assets/styles.css
    lang: en
    title-block-style: none
    toc: false
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: false
    include-after-body: includes/footer.html
